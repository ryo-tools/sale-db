<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セール情報DB | Amazon・楽天・Yahoo!最安値比較</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --sub-text: #64748b;
      --primary: #2563eb;
      --accent: #ef4444;
      --border: #e2e8f0;
      --amazon: #ff9900;
      --rakuten: #bf0000;
      --yahoo: #ff0033;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 40px;
    }
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-inner {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--primary);
      text-decoration: none;
    }
    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .badge-lowest {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 1;
    }
    .img-wrap {
      width: 100%;
      height: 180px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
    }
    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .title {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.4;
      height: 2.8em;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .store-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }
    .store-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      background: #f1f5f9;
      text-decoration: none;
      color: var(--text);
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    .store-item:hover { background: #e2e8f0; }
    .store-name { font-weight: bold; }
    .store-price { font-weight: bold; }
    .store-price.lowest { color: var(--accent); font-size: 1rem; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="#" class="logo">🏷️ 3大EC価格比較DB</a>
    </div>
  </header>

  <main class="container">
    <div class="grid" id="product-grid">
      <div style="grid-column: 1/-1; text-align:center; padding: 40px;">比較データを読み込み中...</div>
    </div>
  </main>

  <script>
    async function loadProducts() {
      const grid = document.getElementById('product-grid');
      try {
        const res = await fetch('products.json');
        if (!res.ok) throw new Error('データが見つかりません');
        const items = await res.json();

        grid.innerHTML = items.map(item => {
          // データ構造が旧データ等の場合でも絶対にエラー落ちしないための安全ガード
          const stores = item.stores || {};
          const amz = stores.amazon || { price: item.currentPrice || null, url: item.shopUrl || '#' };
          const rak = stores.rakuten || { price: null, url: '#' };
          const yah = stores.yahoo || { price: null, url: '#' };

          const lowestStore = item.lowestStore || (amz.price ? 'Amazon' : '');
          const lowestPrice = item.lowestPrice || amz.price;

          const imgUrl = item.imageUrl || (item.asin ? `https://images-na.ssl-images-amazon.com/images/P/${item.asin}.01.LZZZZZZZ.jpg` : '');

          return `
            <div class="card">
              ${lowestStore && lowestPrice ? `<div class="badge-lowest">最安: ${lowestStore} (¥${lowestPrice.toLocaleString()})</div>` : ''}
              <div class="img-wrap">
                <img src="${imgUrl}" alt="${item.title || ''}" loading="lazy" referrerpolicy="no-referrer">
              </div>
              <div class="content">
                <div class="title">${item.title || '名称不明の商品'}</div>
                <div class="store-list">
                  <a href="${amz.url}" target="_blank" rel="noopener" class="store-item">
                    <span class="store-name" style="color:var(--amazon)">Amazon</span>
                    <span class="store-price ${lowestStore === 'Amazon' ? 'lowest' : ''}">${amz.price ? '¥' + amz.price.toLocaleString() : '確認'}</span>
                  </a>
                  <a href="${rak.url}" target="_blank" rel="noopener" class="store-item">
                    <span class="store-name" style="color:var(--rakuten)">楽天市場</span>
                    <span class="store-price ${lowestStore === '楽天市場' ? 'lowest' : ''}">${rak.price ? '¥' + rak.price.toLocaleString() : '確認'}</span>
                  </a>
                  <a href="${yah.url}" target="_blank" rel="noopener" class="store-item">
                    <span class="store-name" style="color:var(--yahoo)">Yahoo!</span>
                    <span class="store-price ${lowestStore === 'Yahoo!ショッピング' ? 'lowest' : ''}">${yah.price ? '¥' + yah.price.toLocaleString() : '確認'}</span>
                  </a>
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px;">エラー: ${err.message}</div>`;
      }
    }

    loadProducts();
  </script>
</body>
</html>
