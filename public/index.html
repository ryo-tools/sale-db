<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>セール＆最安値トラッカー | リアルタイム価格比較データベース</title>
  <meta name="description" content="Amazon・楽天・Yahoo!ショッピングの最新セール情報と最安値価格を自動追跡。ガジェット、PCパーツ、家電、日用品の買時がひと目でわかるデータベース。">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- ヘッダー -->
  <header class="site-header">
    <div class="header-inner">
      <a href="./" class="logo">
        <span class="logo-icon">⚡</span>
        <span class="logo-text">SALE & PRICE TRACKER</span>
      </a>
      <div class="header-status">
        <span class="pulse-icon"></span>
        <span class="status-text">最終更新: <time id="last-updated">---</time></span>
      </div>
    </div>
  </header>

  <!-- ヒーローセクション -->
  <section class="hero-section">
    <div class="hero-inner">
      <h1>主要ECサイトの<span class="highlight">リアルタイム最安値</span>を自動追跡</h1>
      <p class="hero-sub">Amazon・楽天・Yahoo!の価格推移とセール還元率を毎日分析。本当に買い時な商品だけを厳選ピックアップ。</p>
      
      <!-- 統計バッジ -->
      <div class="stats-row">
        <div class="stat-badge">
          <span class="stat-num" id="total-count">--</span>
          <span class="stat-label">追跡中アイテム</span>
        </div>
        <div class="stat-badge">
          <span class="stat-num" id="discount-count">--</span>
          <span class="stat-label">本日値下げアイテム</span>
        </div>
        <div class="stat-badge">
          <span class="stat-num">毎日自動</span>
          <span class="stat-label">価格データ更新</span>
        </div>
      </div>
    </div>
  </section>

  <!-- フィルター ＆ カテゴリタブ -->
  <main class="main-container">
    <section class="filter-section">
      <div class="category-tabs" id="category-tabs">
        <button class="tab-btn active" data-category="all">🔥 すべてのセール品</button>
        <button class="tab-btn" data-category="pc">💻 PCパーツ・ストレージ</button>
        <button class="tab-btn" data-category="gadget">📱 ガジェット・家電</button>
        <button class="tab-btn" data-category="fitness">💪 筋トレ・サプリ</button>
        <button class="tab-btn" data-category="daily">🛒 日用品・食品</button>
      </div>

      <div class="search-sort-bar">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="search-input" placeholder="商品名・型番で検索...">
        </div>
        <div class="sort-box">
          <label for="sort-select">並び順:</label>
          <select id="sort-select">
            <option value="discount-desc">割引率が高い順</option>
            <option value="price-asc">価格が安い順</option>
            <option value="price-desc">価格が高い順</option>
            <option value="updated">更新順</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 商品カードグリッド -->
    <section class="products-grid" id="products-grid">
      <!-- JavaScriptで自動挿入されます -->
    </section>
  </main>

  <!-- フッター -->
  <footer class="site-footer">
    <div class="footer-inner">
      <p class="copyright">&copy; 2026 セール＆最安値トラッカー All Rights Reserved.</p>
      <p class="disclaimer">当サイトはAmazonアソシエイトおよび各種アフィリエイトプログラムに参加しています。掲載価格は自動更新されていますが、最新価格は各ショップにてご確認ください。</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
